# VEYRA zone edge collector — template rendered per zone by edge/render.py.
# Placeholder names are substituted at render time from veyra_common.settings,
# so every limit here still comes from the profile (P5). Never edit the rendered
# vector-<zone>.toml by hand: `make edge-render` overwrites it.
#
# What this config must guarantee (A1, v1 §6 steps 1-4):
#   P1  evidence before parsing: raw bytes are hashed and base64'd before anything looks
#       inside them, and nothing downstream rewrites them.
#   framing: one UDP datagram = one event; TCP is newline-delimited with a continuation
#       rule (a line starting with whitespace, or with "at ", continues the previous one),
#       and joined events keep the original bytes joined with a single \n.
#   resolution: (listener, peer_ip) then (listener, syslog_host) against the inventory
#       enrichment table; no match means unregistered, which is a valid outcome, not an error.
data_dir = "/var/lib/vector"

# Vector's own API, used for the container health check and `vector top`.
[api]
enabled = true
address = "0.0.0.0:8686"

# IF-INVENTORY. Written by control-api (C1); until then it is the file S0 seeded.
# Reload behaviour is verified in edge/RELOAD.md.
[enrichment_tables.sources]
type = "file"

[enrichment_tables.sources.file]
path = "/etc/vector/inventory/sources.csv"

[enrichment_tables.sources.file.encoding]
type = "csv"

[enrichment_tables.sources.schema]
listener = "string"
match_kind = "string"
match_value = "string"
source_id = "string"
tenant_id = "string"
vendor = "string"
zone = "string"

# ---------------------------------------------------------------- sources
# decoding.codec = "bytes" keeps the payload untouched: no syslog parsing at the edge,
# because parsing before sealing would violate P1.
[sources.syslog_udp]
type = "socket"
mode = "udp"
address = "0.0.0.0:5524"
max_length = 65536
host_key = "peer_host"
port_key = "peer_port"

[sources.syslog_udp.decoding]
codec = "bytes"

[sources.syslog_tcp]
type = "socket"
mode = "tcp"
address = "0.0.0.0:5525"
max_length = 65536
host_key = "peer_host"
port_key = "peer_port"

[sources.syslog_tcp.decoding]
codec = "bytes"

[sources.syslog_tcp.framing]
method = "newline_delimited"

# ---------------------------------------------------------------- framing
[transforms.pre_udp]
type = "remap"
inputs = ["syslog_udp"]
source = '''
# A datagram is exactly one event; the kernel already framed it for us.
.transport = "syslog_udp"
.listener = "core-udp"
.framing_method = "datagram"
.parts = 1
'''

[transforms.pre_tcp]
type = "remap"
inputs = ["syslog_tcp"]
source = '''
line = string!(.message)
.transport = "syslog_tcp"
.listener = "core-tcp"
.framing_method = "newline"
.parts = 1
# The continuation rule, identical to veyra_common.framing.is_continuation: leading
# whitespace, or a JVM stack frame ("at com.x.Y(...)"). Keep the two in step.
.is_continuation = match(line, r'^[ \t]') || starts_with(line, "at ")
# Group by peer so two devices interleaving on the same listener never merge.
host = "unknown"
if exists(.peer_host) { host = to_string!(.peer_host) }
port = "0"
if exists(.peer_port) { port = to_string!(.peer_port) }
.join_key = host + ":" + port
'''

[transforms.tcp_join]
type = "reduce"
inputs = ["pre_tcp"]
group_by = ["join_key"]
# A new event begins at the first line that is NOT a continuation, so continuation lines
# accumulate onto the event above them.
starts_when = '!bool!(.is_continuation)'
# Flush an open event this long after its last line, so a trailing stack trace cannot
# hold an event forever.
expire_after_ms = 500
flush_period_ms = 500

[transforms.tcp_join.merge_strategies]
message = "concat_newline"
parts = "sum"

# ---------------------------------------------------------------- stamping (P1)
[transforms.stamp]
type = "remap"
inputs = ["pre_udp", "tcp_join"]
source = '''
raw = string!(.message)

# 1-2. Size. length() is the BYTE length (strlen() would be characters, which would be
# wrong for the Devanagari OT historian lines).
raw_len = length(raw)
truncated = raw_len >= 65536

# 3-4. Seal the bytes before anything parses them.
raw_sha256 = sha2(raw, variant: "SHA-256")
raw_b64 = encode_base64(raw)

# 5-6. Identity and arrival time. uuid_v7 exists on the pinned Vector, so event_uid sorts
# by creation time; received_time carries nanoseconds.
event_uid = uuid_v7()
received_time = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.9fZ")

parts = 1
if exists(.parts) { parts = to_int!(.parts) }
framing_method = string!(.framing_method)
if parts > 1 { framing_method = "multiline_join" }

peer_ip = ""
if exists(.peer_host) { peer_ip = to_string!(.peer_host) }
peer_port_num = 0
if exists(.peer_port) { peer_port_num = to_int!(.peer_port) }
listener = string!(.listener)
transport = string!(.transport)

# IF-ENVELOPE allows null for both, and null is the honest value when the transport did
# not give us a peer (a unix socket, or a replayed file).
peer_ip_out = null
if peer_ip != "" { peer_ip_out = peer_ip }
peer_port_out = null
if peer_port_num != 0 { peer_port_out = peer_port_num }

# Resolution step 1: pull the syslog host out of the header cheaply. RFC 5424 first
# (it has an explicit version digit), then RFC 3164. Only the first 256 bytes matter.
head = slice!(raw, start: 0, end: 256)
syslog_host = ""
parsed_5424 = parse_regex(head, r'^<\d{1,3}>1\s+\S+\s+(?P<host>\S+)') ?? null
if parsed_5424 != null {
    syslog_host = to_string(get!(parsed_5424, ["host"])) ?? ""
} else {
    parsed_3164 = parse_regex(head, r'^<\d{1,3}>(?P<mon>\S+)\s+(?P<day>\S+)\s+(?P<time>\S+)\s+(?P<host>\S+)') ?? null
    if parsed_3164 != null {
        syslog_host = to_string(get!(parsed_3164, ["host"])) ?? ""
    }
}

# Resolution step 2: (listener, peer_ip), then (listener, syslog_host). A miss is not an
# error — it means the source is unregistered, which is a first-class outcome (P2).
row = null
if peer_ip != "" {
    row = get_enrichment_table_record("sources", {"listener": listener, "match_kind": "peer_ip", "match_value": peer_ip}) ?? null
}
if row == null && syslog_host != "" {
    row = get_enrichment_table_record("sources", {"listener": listener, "match_kind": "syslog_host", "match_value": syslog_host}) ?? null
}

source_id = "unregistered"
tenant_id = "unassigned"
vendor = "unregistered"
zone = "core"
if row != null {
    source_id = to_string(get!(row, ["source_id"])) ?? "unregistered"
    tenant_id = to_string(get!(row, ["tenant_id"])) ?? "unassigned"
    vendor = to_string(get!(row, ["vendor"])) ?? "unregistered"
    zone = to_string(get!(row, ["zone"])) ?? "core"
}

# Build IF-ENVELOPE explicitly, so no Vector metadata leaks onto the wire and the field
# set matches veyra_common.models.Envelope exactly (extra="forbid" would reject extras).
. = {
  "v": 1,
  "event_uid": event_uid,
  "tenant_id": tenant_id,
  "source_id": source_id,
  "vendor": vendor,
  "zone": zone,
  "collector_id": "edge-core-01",
  "transport": transport,
  "peer_ip": peer_ip_out,
  "peer_port": peer_port_out,
  "listener": listener,
  "received_time": received_time,
  "seq_no": null,
  "raw_sha256": raw_sha256,
  "raw_len": raw_len,
  "raw_b64": raw_b64,
  "framing": {"method": framing_method, "truncated": truncated, "parts": parts},
  "custody": "realtime",
  "auth": {"method": "ip_map", "key_id": null},
  "salt": null
}
'''

# ---------------------------------------------------------------- sink
[sinks.kafka_raw]
type = "kafka"
inputs = ["stamp"]
bootstrap_servers = "kafka:9092"
# One topic per vendor (IF-TOPICS); the key is source_id so a source's events keep order.
topic = "raw.{{ vendor }}"
key_field = "source_id"
compression = "zstd"

[sinks.kafka_raw.encoding]
codec = "json"

# The topic is templated per vendor, so Vector cannot resolve it without an event and logs
# "Could not generate topic for healthcheck". Liveness is covered by the container health
# check against Vector's own API instead.
[sinks.kafka_raw.healthcheck]
enabled = false

[sinks.kafka_raw.librdkafka_options]
"acks" = "all"
"enable.idempotence" = "true"

# Disk buffer with when_full=block: if Kafka is down the edge holds events on disk and
# applies backpressure rather than dropping them (P2, v1 §13 edge failure).
[sinks.kafka_raw.buffer]
type = "disk"
max_size = 268435488
when_full = "block"
