# PLACEHOLDER (S0). Shape is IF-CONTRACT-YAML; C2 finalizes. The cef envelope layer
# exposes the header fields plus the extension kv pairs, each with a byte span, so the
# mapped values stay traceable (P4).
contract: acme_ngfw_cef
version: 1
tenant: t_ntro_core
sources: [src_fw_dmz_01]
description: Acme NGFW traffic and threat events in CEF (library pack)
state: active

envelope:
  - cef: {}

time:
  field: cef.rt
  formats: ["%b %d %Y %H:%M:%S"]
  timezone: Asia/Kolkata
  year: present

templates:
  - id: traffic_deny
    pattern: 'traffic deny'
    class: network_activity
    activity: refuse
    map:
      src_endpoint.ip: $cef.src
      dst_endpoint.ip: $cef.dst
      dst_endpoint.port: $cef.dpt
      connection_info.protocol_name: $cef.proto
      disposition_id: {const: 2}
      severity_id: {const: 3}
      metadata.product.vendor_name: {const: Acme}
      metadata.product.name: {const: NGFW}
      message: $__text
    unmapped: [deviceInboundInterface, cs1, cs1Label]

  - id: traffic_allow
    pattern: 'traffic allow'
    class: network_activity
    activity: traffic
    map:
      src_endpoint.ip: $cef.src
      dst_endpoint.ip: $cef.dst
      dst_endpoint.port: $cef.dpt
      connection_info.protocol_name: $cef.proto
      traffic.bytes_in: $cef.in
      traffic.bytes_out: $cef.out
      disposition_id: {const: 1}
      severity_id: {const: 1}
      message: $__text

  - id: threat_blocked
    pattern: 'threat blocked'
    class: network_activity
    activity: refuse
    map:
      src_endpoint.ip: $cef.src
      dst_endpoint.ip: $cef.dst
      dst_endpoint.port: $cef.dpt
      disposition_id: {const: 2}
      severity_id: {const: 4}
      message: $__text

required: [time, src_endpoint.ip, dst_endpoint.ip]
enrich: [zone_map]
pii: [src_endpoint.ip]
vocab: []
tests:
  - sample: samples/acme_ngfw_cef/deny_1.log
    expect: expected/acme_ngfw_cef/deny_1.json
provenance:
  drafted_by: library
  approved_by: [admin@veyra]
