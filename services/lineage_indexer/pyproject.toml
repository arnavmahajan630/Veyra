[project]
name = "lineage-indexer"
version = "0.1.0"
description = "Kafka to ClickHouse lineage indexer (owner B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-lineage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_indexer"]
