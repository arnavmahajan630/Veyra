[project]
name = "ingest-gateway"
version = "0.1.0"
description = "HEC-compatible HTTP push ingestion (owner A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-common[api]",
    # /v1/batch takes a multipart file upload, which is FastAPI's only hard extra dependency.
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_gateway"]
