[project]
name = "demo-engine"
version = "0.1.0"
description = "Demo scenario engine: stages, reset, tamper, preflight (owner B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-common[api]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_engine"]
