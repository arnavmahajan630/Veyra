[project]
name = "evidence-api"
version = "0.1.0"
description = "Lineage and evidence REST API (owner B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-common[api]",
    "veyra-evidence",
    "veyra-lineage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_api"]
