[project]
name = "archiver"
version = "0.1.0"
description = "Evidence vault archiver: segments, chain, encryption (owner B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-evidence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archiver"]
