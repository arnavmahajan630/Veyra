[project]
name = "control-api"
version = "0.1.0"
description = "Control plane API: tenants, sources, keys, contracts, drift (owner C)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-common[api]",
    "veyra-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_api"]
