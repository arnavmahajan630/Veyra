[project]
name = "drift-worker"
version = "0.1.0"
description = "Drain3 drift detection worker (owner C)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-contracts",
    "veyra-common[api]",
    "drain3>=0.9.11",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_worker"]
