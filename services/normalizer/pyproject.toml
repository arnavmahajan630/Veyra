[project]
name = "normalizer"
version = "0.1.0"
description = "Deterministic normalizer (veyra_engine in a transactional Kafka loop) (owner A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalizer"]
