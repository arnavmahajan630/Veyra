[project]
name = "router"
version = "0.1.0"
description = "Declarative router to Wazuh and partner sinks (owner A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    # The fallback routes document is YAML (IF-ROUTES); control-api ships the same file.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]
