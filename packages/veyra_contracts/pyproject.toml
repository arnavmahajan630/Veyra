[project]
name = "veyra-contracts"
version = "0.1.0"
description = "VEYRA Log Contract models, compiler, golden test runner (owner C)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "veyra-engine",
    "PyYAML>=6.0",
    "google-re2>=1.1",
    "pydantic>=2.11",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_contracts"]
