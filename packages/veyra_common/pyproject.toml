[project]
name = "veyra-common"
version = "0.1.0"
description = "VEYRA shared settings, record models, Kafka helpers, ids, hashing, service base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "confluent-kafka>=2.11",
    "uuid-utils>=0.12",
    "prometheus-client>=0.23",
]

[project.optional-dependencies]
api = ["fastapi>=0.121", "uvicorn[standard]>=0.38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_common"]
