[project]
name = "veyra-evidence"
version = "0.1.0"
description = "VEYRA evidence: chain, segments, merkle, keyprovider, verify (owner B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "zstandard>=0.25",
    "cryptography>=46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_evidence"]
