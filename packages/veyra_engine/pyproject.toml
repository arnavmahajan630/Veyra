[project]
name = "veyra-engine"
version = "0.1.0"
description = "VEYRA deterministic parse/normalize engine (S0: stub per IF-ENGINE-LIB)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "charset-normalizer>=3.4",
    "jsonschema>=4.25",
    "fastjsonschema>=2.21",
    "google-re2>=1.1",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_engine"]
