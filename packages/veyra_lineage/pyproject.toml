[project]
name = "veyra-lineage"
version = "0.1.0"
description = "VEYRA lineage: ClickHouse schema + query library (owner B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "veyra-common",
    "clickhouse-connect>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_lineage"]
