# Wazuh single-node (D6), based on the official wazuh-docker single-node deployment.
# Kept in its own file so the whole SIEM can move to another machine when RAM is tight:
#   make up PROFILE=laptop WAZUH=local     # this file is merged in
#   make up PROFILE=laptop WAZUH=remote    # this file is skipped; the router uses syslog_tcp
#
# Certificates are generated once by `make wazuh-certs` into data/wazuh/certs.
# VEYRA delivers events as NDJSON into data/sinks/wazuh/veyra.ndjson, which the manager
# tails via wazuh/ossec.conf.d/veyra_localfile.xml (IF-WAZUH).
name: veyra

services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.8
    container_name: veyra-wazuh-indexer
    hostname: wazuh.indexer
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms${VEYRA_WAZUH_INDEXER_HEAP:-1g} -Xmx${VEYRA_WAZUH_INDEXER_HEAP:-1g}
      bootstrap.memory_lock: "true"
      NODE_NAME: wazuh.indexer
      CLUSTER_INITIAL_MASTER_NODES: wazuh.indexer
      CLUSTER_NAME: wazuh-cluster
      DISCOVERY_SERVICE: wazuh.indexer
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${VEYRA_WAZUH_INDEXER_PASSWORD:-admin}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: ${VEYRA_MEM_WAZUH_INDEXER:-1.8g}
    restart: unless-stopped
    volumes:
      # Named volume, not a bind mount: the indexer runs as its own uid and cannot write
      # into a host-owned directory (AccessDeniedException on performance_analyzer_enabled.conf).
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      # The 4.14 image generates its own config/opensearch.yml from the environment and
      # reads certificates from ${OPENSEARCH_PATH_CONF}/certs with fixed names
      # (indexer.pem / indexer-key.pem / root-ca.pem / admin*.pem). Mounting a custom
      # opensearch.yml elsewhere is silently ignored, which leaves the demo certs in
      # place and makes securityadmin fail with "path does not chain".
      - ../data/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ../data/wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/indexer-key.pem:ro
      - ../data/wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/indexer.pem:ro
      - ../data/wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ../data/wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
    ports: ["9200:9200"]
    networks: [veyra_net]

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    container_name: veyra-wazuh-manager
    hostname: wazuh.manager
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${VEYRA_WAZUH_INDEXER_PASSWORD:-admin}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${VEYRA_WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: ${VEYRA_MEM_WAZUH_MANAGER:-700m}
    restart: unless-stopped
    ports: ["1514:1514", "1515:1515", "514:514/udp", "55000:55000"]
    volumes:
      # Named volumes, seeded from the image on first start. Bind-mounting empty host
      # directories here wipes the image's own /etc/filebeat and /var/ossec contents.
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ../data/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ../data/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ../data/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      # VEYRA's own bits: the NDJSON sink the router writes, plus rules and localfile.
      - ../data/sinks/wazuh:/sinks/wazuh
      - ../wazuh/rules/veyra_rules.xml:/veyra/veyra_rules.xml:ro
      - ../wazuh/ossec.conf.d/veyra_localfile.xml:/veyra/veyra_localfile.xml:ro
      - ../wazuh/entrypoint-veyra.sh:/veyra/entrypoint-veyra.sh:ro
    entrypoint: ["/bin/bash", "/veyra/entrypoint-veyra.sh"]
    networks: [veyra_net]

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    container_name: veyra-wazuh-dashboard
    hostname: wazuh.dashboard
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${VEYRA_WAZUH_INDEXER_PASSWORD:-admin}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${VEYRA_WAZUH_DASHBOARD_PASSWORD:-kibanaserver}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${VEYRA_WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
    mem_limit: ${VEYRA_MEM_WAZUH_DASHBOARD:-800m}
    restart: unless-stopped
    ports: ["8443:5601"]
    volumes:
      - ../data/wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem:ro
      - ../data/wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem:ro
      - ../data/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - ./wazuh/dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    depends_on: [wazuh-indexer]
    networks: [veyra_net]

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  wazuh_dashboard_config:

networks:
  # Merged with the base file's definition (same name), so `docker compose -f base -f
  # wazuh` shares one bridge. On a remote Wazuh host this file is used alone and the
  # network is created here.
  veyra_net:
    name: veyra_net
