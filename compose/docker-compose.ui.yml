# A Kafka web UI for demos and load tests: topics, partitions, consumer-group lag, live
# message rates. Read-only by configuration. http://localhost:8085
services:
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: veyra-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: veyra
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
    ports: ["${VEYRA_KAFKA_UI_PORT:-8085}:8080"]
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks: [veyra_net]
