# VEYRA base stack (appliance mode, v1 §12.1). Every limit comes from the profile:
#   make up PROFILE=laptop            # profiles/laptop.env -> .env.local -> shell env
# Wazuh lives in docker-compose.wazuh.yml so it can run on another machine (WAZUH=remote).
#
# Image tags are pinned (IF-VERSIONS). Do not bump one without a VERSION-PIN changelog entry.
name: veyra

x-py: &py
  build:
    context: ..
    dockerfile: docker/python.Dockerfile
  image: veyra/python:0.1.0
  env_file: [../.env.runtime]
  environment:
    VEYRA_KAFKA_BOOTSTRAP: kafka:9092
    VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
    VEYRA_IMMUDB_HOST: immudb
    # Services run as the invoking uid, which has no passwd entry in the image. dulwich (the
    # contract registry's git) and getpass need a user name, or control-api's reset fails.
    USER: veyra
  mem_limit: ${VEYRA_MEM_PY_SERVICE:-192m}
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - ../data:/app/data
  networks: [veyra_net]
  depends_on:
    kafka:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- L2 bus
  kafka:
    image: apache/kafka:4.1.2
    container_name: veyra-kafka
    hostname: kafka
    environment:
      # Single-node KRaft: one process is both broker and controller (deviation #3;
      # durability settings are kept, RF3 is a profile change).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${VEYRA_KAFKA_REPLICATION:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${VEYRA_KAFKA_REPLICATION:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${VEYRA_RAW_PARTITIONS_PER_VENDOR:-3}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx${VEYRA_KAFKA_HEAP:-512m} -Xms${VEYRA_KAFKA_HEAP:-512m}
      CLUSTER_ID: veyra-demo-cluster-00
    ports: ["9092:9092", "29092:29092"]
    volumes: ["../data/kafka:/var/lib/kafka/data"]
    mem_limit: ${VEYRA_MEM_KAFKA:-1g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks: [veyra_net]

  # ---------------------------------------------------------------- L5 lineage index
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: veyra-clickhouse
    environment:
      CLICKHOUSE_DB: ${VEYRA_CLICKHOUSE_DB:-veyra}
      CLICKHOUSE_USER: ${VEYRA_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${VEYRA_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_SKIP_USER_SETUP: 1
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_TO_RAM_RATIO: 0.7
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ../data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: ${VEYRA_MEM_CLICKHOUSE:-1g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [veyra_net]

  # ---------------------------------------------------------------- L3 ledger
  immudb:
    image: codenotary/immudb:1.11.2-bullseye-slim
    container_name: veyra-immudb
    # Runs as the invoking user (make writes VEYRA_UID/GID), so ./data/immudb stays
    # writable and nothing in data/ ends up owned by root.
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    environment:
      IMMUDB_ADDRESS: 0.0.0.0
      IMMUDB_PGSQL_SERVER: "true"
      IMMUDB_ADMIN_PASSWORD: ${VEYRA_IMMUDB_PASSWORD:-immudb}
      # Required because the container runs as a numeric uid: immudb's Go binary has no
      # cgo and falls back to $USER for user.Current().
      USER: immudb
    ports: ["3322:3322", "${VEYRA_IMMUDB_PG_HOST_PORT:-5433}:5432", "9497:9497"]
    volumes: ["../data/immudb:/var/lib/immudb"]
    mem_limit: ${VEYRA_MEM_IMMUDB:-256m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "immuadmin status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [veyra_net]

  # ---------------------------------------------------------------- L1 zone edge
  edge-dmz:
    image: timberio/vector:0.58.0-debian
    container_name: veyra-edge-dmz
    command: ["--config", "/etc/vector/vector-dmz.toml", "--watch-config"]
    environment:
      VECTOR_LOG: warn
      VEYRA_MAX_EVENT_BYTES: ${VEYRA_MAX_EVENT_BYTES:-65536}
      VEYRA_EDGE_BUFFER_BYTES: ${VEYRA_EDGE_BUFFER_BYTES:-268435456}
    ports:
      - "5514:5514/udp"
      - "5515:5515/tcp"
    volumes:
      - ../edge/vector:/etc/vector:ro
      - ../data/vector/dmz:/var/lib/vector
    mem_limit: ${VEYRA_MEM_VECTOR:-128m}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "vector top --url http://localhost:8686/graphql >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [veyra_net]

  edge-core:
    image: timberio/vector:0.58.0-debian
    container_name: veyra-edge-core
    command: ["--config", "/etc/vector/vector-core.toml", "--watch-config"]
    environment:
      VECTOR_LOG: warn
      VEYRA_MAX_EVENT_BYTES: ${VEYRA_MAX_EVENT_BYTES:-65536}
      VEYRA_EDGE_BUFFER_BYTES: ${VEYRA_EDGE_BUFFER_BYTES:-268435456}
    ports:
      - "5524:5524/udp"
      - "5525:5525/tcp"
    volumes:
      - ../edge/vector:/etc/vector:ro
      - ../data/vector/core:/var/lib/vector
    mem_limit: ${VEYRA_MEM_VECTOR:-128m}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks: [veyra_net]

  # ---------------------------------------------------------------- L7 one origin
  caddy:
    image: caddy:2.11.4-alpine
    container_name: veyra-caddy
    ports: ["${VEYRA_CONSOLE_PORT:-8080}:8080"]
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../console/dist:/srv/console:ro
      - ../data/caddy:/data
    mem_limit: 64m
    restart: unless-stopped
    networks: [veyra_net]

  # ---------------------------------------------------------------- Python services
  # Each one is the same image with a different command. They are commented in until
  # their owning phase lands, so `make up` on a fresh clone only starts what works.
  # A2: ingest-gateway, A3: normalizer, A6: router,
  # B1/B2/B3/B4/B7: lineage-indexer, archiver, integrity, evidence-api, demo-engine,
  # C1/C3: control-api, drift-worker.
  ingest-gateway:
    <<: *py
    container_name: veyra-ingest-gateway
    profiles: ["a2"]
    command: ["python", "-m", "ingest_gateway"]
    # Reads data/keys/api_pepper, which control-api writes mode 0400 as the invoking user, so this
    # service has to be that same user or it cannot authenticate anybody (A2).
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8088:8088"]

  normalizer:
    <<: *py
    container_name: veyra-normalizer
    profiles: ["a3"]
    command: ["python", "-m", "normalizer"]
    # Writes data/state/normalizer_inflight (A4's crash-loop journal), so it runs as the invoking
    # user like control-api and ingest-gateway. As the image user it could not write there, and the
    # journal degrades quietly by design — the guard was silently inert.
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8201:8201"]

  router:
    <<: *py
    container_name: veyra-router
    profiles: ["a6"]
    command: ["python", "-m", "router"]
    # Creates data/keys/route_hmac and appends to the host-owned sink files, so it runs as the
    # invoking user like control-api, ingest-gateway and the normalizer (A6; A5 logged the rule).
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8202:8202"]
    volumes:
      - ../data:/app/data
      - ../data/sinks:/sinks

  control-api:
    <<: *py
    container_name: veyra-control-api
    profiles: ["c1"]
    command: ["python", "-m", "control_api"]
    # Writes the contracts repository and the edge inventory on the host, so it runs as the
    # invoking user (make writes VEYRA_UID/GID), like immudb.
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8000:8000"]
    volumes:
      - ../data:/app/data
      # The separate contracts repository sits beside Veyra/. Mounted at /contracts-repo so
      # the default VEYRA_CONTRACTS_REPO=../contracts-repo resolves the same from /app.
      - ../../contracts-repo:/contracts-repo
      - ../edge/vector/inventory:/app/edge/vector/inventory
      - ../edge/vector/reload.stamp:/app/edge/vector/reload.stamp

  drift-worker:
    <<: *py
    container_name: veyra-drift-worker
    profiles: ["c3"]
    command: ["python", "-m", "drift_worker"]
    # Writes data/state/{drift,drain3}, so it runs as the invoking user like the others.
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    # /flush and /reset for demo-engine and control-api; state in data/state/{drift,drain3}
    ports: ["8206:8206"]

  demo-engine:
    <<: *py
    container_name: veyra-demo-engine
    profiles: ["b7"]
    command: ["python", "-m", "demo_engine"]
    # Caddy proxies /api/demo/* here and Prometheus scrapes the same port (IF-PORTS).
    ports: ["8300:8300"]
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      VEYRA_DEMO_MODE: "1"
    volumes:
      - ../data:/app/data
      # DEVIATION (00_MASTER §7, demo profile only): the reset restarts the stateful
      # consumers through the Docker Engine API, so it needs the socket. Nothing else in
      # VEYRA touches Docker, and this service exists only on a demo machine.
      - /var/run/docker.sock:/var/run/docker.sock
    # The demo engine drives the edge listeners and the gateway, so it starts after them.
    depends_on:
      kafka:
        condition: service_healthy

  # Track B services. They share data/vault and data/keys (mode 0400 files), so every one of
  # them runs as the invoking user: the archiver writes the KEK, the others must read it.
  lineage-indexer:
    <<: *py
    container_name: veyra-lineage-indexer
    profiles: ["b1"]
    command: ["python", "-m", "lineage_indexer"]
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8205:8205"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  archiver:
    <<: *py
    container_name: veyra-archiver
    profiles: ["b2"]
    command: ["python", "-m", "archiver"]
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8203:8203"]

  integrity:
    <<: *py
    container_name: veyra-integrity
    profiles: ["b3"]
    command: ["python", "-m", "integrity"]
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8204:8204"]

  evidence-api:
    <<: *py
    container_name: veyra-evidence-api
    profiles: ["b4"]
    command: ["python", "-m", "evidence_api"]
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    ports: ["8100:8100"]

  # Extra normalizer instances for the load test (`veyra load`). Same consumer group, so
  # Kafka spreads the raw.* partitions across them; a distinct VEYRA_INSTANCE gives each its
  # own transactional.id, which exactly-once needs.
  normalizer-2: &norm_scale
    <<: *py
    profiles: ["scale"]
    command: ["python", "-m", "normalizer"]
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      USER: veyra
      VEYRA_INSTANCE: "2"
  normalizer-3:
    <<: *norm_scale
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      USER: veyra
      VEYRA_INSTANCE: "3"
  normalizer-4:
    <<: *norm_scale
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      USER: veyra
      VEYRA_INSTANCE: "4"
  normalizer-5:
    <<: *norm_scale
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      USER: veyra
      VEYRA_INSTANCE: "5"
  normalizer-6:
    <<: *norm_scale
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      USER: veyra
      VEYRA_INSTANCE: "6"

  # One-off helper for ./veyra.sh: topics, edge render, smoke check, demo walkthrough, load
  # generator. The live source trees are mounted over the image's copies, so a fresh edit
  # runs without a rebuild.
  tools:
    <<: *py
    profiles: ["tools"]
    restart: "no"
    user: "${VEYRA_UID:-1000}:${VEYRA_GID:-1000}"
    command: ["python", "-c", "print('usage: docker compose run --rm tools <command>')"]
    environment:
      VEYRA_KAFKA_BOOTSTRAP: kafka:9092
      VEYRA_CLICKHOUSE_URL: http://clickhouse:8123
      VEYRA_IMMUDB_HOST: immudb
      USER: veyra
      # The invoking uid has no home directory inside the image.
      HOME: /tmp
    mem_limit: ${VEYRA_MEM_TOOLS:-2g}
    volumes:
      - ../data:/app/data
      - ../edge:/app/edge
      - ../demo:/app/demo:ro
      - ../tools:/app/tools:ro
      - ../profiles:/app/profiles:ro

networks:
  veyra_net:
    name: veyra_net
    driver: bridge
    ipam:
      config:
        # Fixed subnet so demo senders can hold static IPs the inventory maps
        # (IF-INVENTORY resolves on peer_ip).
        - subnet: 172.20.0.0/16
