# The decision-model server on an NVIDIA GPU. veyra.sh adds this file on top of
# docker-compose.decision.yml when `docker run --gpus all` works on the host.

services:
  ollaya:
    image: ghcr.io/ollaya-dev/ollaya:0.9.0-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
