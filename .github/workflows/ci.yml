# CI mirrors `make ci` exactly: lint, unit tests, plan-check. Integration tests need the
# compose stack and run locally with `make test-int` (01_TEAM_GUIDE §4.1 step 5).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -m "not int"
      - run: uv run python tools/plan_check.py

  console:
    runs-on: ubuntu-latest
    # The console is scaffolded in C5; until then this job only pins the Node version
    # so local and CI agree (IF-VERSIONS: Node 25, build only — decision D17).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      - run: |
          if [ -f console/package.json ]; then
            cd console && npm ci && npm run build
          else
            echo "console/ not scaffolded yet (C5)"
          fi
